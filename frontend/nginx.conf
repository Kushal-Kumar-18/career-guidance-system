# Served by the frontend Dockerfile.prod image (nginx:1.27-alpine).
# This is the single public entry point in the EC2 deployment — see
# docs/AWS_ARCHITECTURE.md. Only this container's port 80 is published
# to the host / security group; backend (4000), ml-service (8000), and
# postgres (5432) are reachable only on the internal Docker network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing — unknown paths fall back to
    # index.html rather than a raw Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied to the backend container by its Docker Compose service
    # name — resolvable only inside the app's Docker network.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # NOTE: the /files/ proxy that used to sit here has been removed
    # along with the backend's static mount. Generated resume PDFs are
    # personal data and are now served only by the authenticated,
    # ownership-checked route GET /api/resume/download (proxied by the
    # /api/ block above). Do not re-add a /files/ location — it would
    # republish every stored resume at a guessable, unauthenticated URL.

    # Static asset caching — Vite fingerprints filenames on every build,
    # so long-lived caching here is safe (a new build gets new filenames).
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
