# Local development convenience only (architecture doc section 29 —
# NOT the AWS/ECS deployment strategy, which is explicitly out of scope
# for this task). Not build-tested in this sandbox; validate before use.
version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: career_guidance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d career_guidance']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ml-service:
    build: ./ml-service
    ports:
      - '8000:8000'
    env_file: ./ml-service/.env.example
    environment:
      # User feedback ratings are the only training data this service
      # has and cannot be regenerated, so they go in Postgres rather than
      # the container filesystem (see ml-service/app/storage/feedback_store.py
      # and db/migrations/0003_ml_feedback.sql). Overrides FEEDBACK_STORE
      # from the env_file above.
      FEEDBACK_STORE: postgres
      FEEDBACK_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/career_guidance
    volumes:
      # The trained calibration model (.pkl) is still a file. Persisting
      # the directory means a rebuilt container doesn't have to retrain
      # from scratch, and it's also where feedback falls back to if
      # Postgres is unreachable.
      - ml_models:/app/app/data/ml_models
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/career_guidance
      ML_SERVICE_URL: http://ml-service:8000
      # Local dev only. NODE_ENV=production refuses to start with a
      # placeholder value like this one — see backend/src/config/env.js.
      AUTH_SECRET: local-dev-only-not-a-real-secret-value-0123456789
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Browser JS runs on the host, not inside the Docker network, so
        # this must point at the backend's host-mapped port (matches the
        # `backend` service's '4000:4000' port mapping above) rather than
        # the in-network service name `backend`.
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - '4173:4173'
    depends_on:
      - backend

volumes:
  pgdata:
  ml_models:
